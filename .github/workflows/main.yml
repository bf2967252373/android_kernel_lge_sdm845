name: Build GKI Kernel with SukiSU

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    
    steps:
    - name: Clean workspace
      run: |
        rm -rf .repo || true
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc ccache \
          libssl-dev repo python-is-python3 bazel bazel-remote
        
    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Initialize kernel source
      run: |
        # 使用已知有效的分支
        repo init -u https://android.googlesource.com/kernel/manifest \
          -b common-android13-5.15 --depth=1
        
        # 同步源码（添加重试机制）
        for i in {1..5}; do
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags && break
          echo "Repo sync failed (attempt $i/5), retrying in 10 seconds..."
          sleep 10
        done
        
    - name: Apply SukiSU patches
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
    - name: Configure build environment
      run: |
        # 创建新的构建配置
        cat > build.config.gki.aarch64 <<EOL
        # 基础配置
        DEFCONFIG=gki_defconfig
        
        # 架构和工具链
        ARCH=arm64
        CLANG_TRIPLE=aarch64-linux-gnu-
        CROSS_COMPILE=aarch64-linux-gnu-
        
        # 构建选项
        BUILD_INITRAMFS=1
        BUILD_GKI=1
        BUILD_BOOT_IMG=0
        BUILD_VENDOR_BOOT=0
        LTO=n
        
        # SukiSU/KernelSU 所需选项
        POST_DEFCONFIG_CMDS="update_config_for_kernelsu"
        function update_config_for_kernelsu() {
            ${KERNEL_DIR}/scripts/config --file ${OUT_DIR}/.config \\
                -e OVERLAY_FS \\
                -e KPROBES \\
                -e KALLSYMS \\
                -e KALLSYMS_ALL \\
                -e MODULES \\
                -e MODULE_UNLOAD \\
                -e TRACEPOINTS
        }
        EOL
        
        # 应用配置
        cp build.config.gki.aarch64 common/build.config.gki.aarch64
        
    - name: Build kernel with Bazel
      run: |
        # 使用 Bazel 构建
        tools/bazel run --config=fast //common:kernel_aarch64_dist
        
    - name: Verify build artifacts
      run: |
        # 检查 Bazel 输出
        if [ ! -f "bazel-bin/common/kernel_aarch64_dist" ]; then
            echo "::error::Bazel build failed!"
            ls -R bazel-bin
            exit 1
        fi
        
        # 检查内核映像
        if [ ! -f "out/common-android13-5.15/dist/Image" ]; then
            echo "::error::Kernel image not found!"
            find out -name Image -print
            exit 1
        fi
        echo "✅ Kernel build successful!"
        
    - name: Archive artifacts
      run: |
        # 查找输出目录
        dist_dir=$(find out -name dist -type d | head -1)
        if [ -z "$dist_dir" ]; then
            dist_dir="out/common-android13-5.15/dist"
            mkdir -p $dist_dir
        fi
        
        # 复制 Bazel 输出
        cp bazel-bin/common/kernel_aarch64_dist $dist_dir/
        
        # 打包产物
        cd $dist_dir
        zip -r kernel_artifacts.zip *
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: ${{ github.workspace }}/$dist_dir/kernel_artifacts.zip
