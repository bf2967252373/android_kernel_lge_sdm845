name: Build GKI Kernel with SukiSU

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    
    steps:
    - name: Clean workspace
      run: |
        rm -rf .repo || true
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc ccache \
          libssl-dev repo python-is-python3
        
    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Find valid kernel branch
      id: find-branch
      run: |
        # 获取可用分支列表
        branches=$(git ls-remote https://android.googlesource.com/kernel/manifest | grep -o 'refs/heads/[^ ]*')
        echo "Available branches:"
        echo "$branches"
        
        # 选择合适的分支（优先选择LTS分支）
        if echo "$branches" | grep -q "refs/heads/common-android13-5.15"; then
          branch="common-android13-5.15"
        elif echo "$branches" | grep -q "refs/heads/android12-5.10-lts"; then
          branch="android12-5.10-lts"
        else
          # 回退到第一个可用分支
          branch=$(echo "$branches" | head -1 | sed 's|refs/heads/||')
        fi
        
        echo "Selected branch: $branch"
        echo "branch=$branch" >> $GITHUB_OUTPUT
        
    - name: Initialize kernel source
      run: |
        echo "Initializing with branch: ${{ steps.find-branch.outputs.branch }}"
        repo init -u https://android.googlesource.com/kernel/manifest \
          -b ${{ steps.find-branch.outputs.branch }} --depth=1
        
        # 同步源码（添加重试机制）
        for i in {1..5}; do
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags && break
          echo "Repo sync failed (attempt $i/5), retrying in 10 seconds..."
          sleep 10
        done
        
    - name: Apply SukiSU patches
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
    - name: Configure build environment
      run: |
        # 禁用LTO编译
        if [ -f "common/build.config.gki.aarch64" ]; then
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' common/build.config.gki.aarch64
          echo 'export LTO=n' >> common/build.config.gki.aarch64
        fi
        
        # 跳过boot镜像生成
        echo 'BUILD_BOOT_IMG=0' >> common/build.config.gki.aarch64
        echo 'BUILD_VENDOR_BOOT=0' >> common/build.config.gki.aarch64
        
    - name: Build kernel
      run: |
        source build/envsetup.sh
        build/build.sh
        
    - name: Verify build artifacts
      run: |
        # 动态查找输出目录
        dist_dir=$(find out -name dist -type d | head -1)
        if [ -z "$dist_dir" ]; then
          echo "::error::No dist directory found!"
          find . -type d | grep out
          exit 1
        fi
        
        if [ ! -f "$dist_dir/Image.gz" ]; then
          echo "::error::Kernel image not found in $dist_dir!"
          ls -la "$dist_dir"
          exit 1
        fi
        echo "✅ Kernel build successful!"
        
    - name: Archive artifacts
      run: |
        dist_dir=$(find out -name dist -type d | head -1)
        cd "$dist_dir"
        zip -r kernel_artifacts.zip *
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: ${{ github.workspace }}/$dist_dir/kernel_artifacts.zip
