name: Build GKI Kernel with SukiSU # 工作流名称：构建GKI内核（含SukiSU）

on: [push] # 触发条件：每次代码推送到仓库时

jobs:
  build:
    runs-on: ubuntu-24.04 # 运行环境：使用最新LTS版本的Ubuntu 24.04
    timeout-minutes: 180 # 超时时间：180分钟，防止长时间无响应

    steps:
    - name: Clean workspace # 步骤1：清理工作空间
      run: |
        rm -rf .repo || true # 删除可能存在的.repo目录，确保构建环境干净

    - name: Checkout code # 步骤2：检出代码
      uses: actions/checkout@v4 # 使用actions/checkout@v4动作检出当前仓库代码

    - name: Install dependencies # 步骤3：安装依赖
      run: |
        sudo apt update # 更新apt包列表
        sudo apt install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc ccache \
          libssl-dev repo python-is-python3 \
          gcc g++ make cmake ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          clang lld llvm binutils binutils-aarch64-linux-gnu \
          clang-18 llvm-18 lld-18 \
          libelf-dev libz-dev # 安装所有必要的构建工具和库，包括交叉编译工具链和LLVM/Clang相关工具

    - name: Set up LLVM symlinks # 步骤4：设置LLVM符号链接
      run: |
        # 创建必要的符号链接，将版本化的Clang/LLVM工具链接到常用名称，方便后续构建系统调用
        sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
        sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
        sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
        sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
        
        # 验证链接是否成功创建
        ls -l /usr/bin/ld.lld
        ld.lld --version

    - name: Setup repo tool # 步骤5：设置repo工具
      run: |
        mkdir -p ~/bin # 创建~/bin目录
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo # 下载repo工具
        chmod a+x ~/bin/repo # 赋予执行权限
        echo "$HOME/bin" >> $GITHUB_PATH # 将repo工具所在目录添加到PATH环境变量，使其可在任何地方执行

    - name: Initialize kernel source # 步骤6：初始化内核源码
      run: |
        # 使用repo工具初始化Android内核源码仓库，指定manifest文件和分支（common-android13-5.15）
        # --depth=1 参数只拉取最新提交，减少下载量
        repo init -u https://android.googlesource.com/kernel/manifest \
          -b common-android13-5.15 --depth=1
        
        # 同步源码（包含重试机制，以提高成功率）
        for i in {1..5}; do # 尝试同步5次
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags && break # 同步命令，使用所有CPU核心，强制同步，不克隆bundle和标签
          echo "Repo sync failed (attempt $i/5), retrying in 10 seconds..." # 同步失败则提示并等待
          sleep 10
        done

    - name: Apply SukiSU patches # 步骤7：应用SukiSU补丁
      run: |
        # 从KernelSU官方仓库下载并执行setup.sh脚本，以应用SukiSU所需的内核补丁
        # main 参数表示使用主分支的补丁
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

    - name: Configure kernel for SukiSU # 步骤8：为SukiSU配置内核
      run: |
        cd common # 进入内核源码根目录（repo sync后，内核代码通常在 common 目录下）
        
        make gki_defconfig # 生成GKI（Generic Kernel Image）默认配置
        
        # 使用scripts/config脚本启用SukiSU所需的内核配置选项
        ./scripts/config --enable OVERLAY_FS
        ./scripts/config --enable KPROBES
        ./scripts/config --enable KALLSYMS
        ./scripts/config --enable KALLSYMS_ALL
        ./scripts/config --enable MODULES
        ./scripts/config --enable MODULE_UNLOAD
        ./scripts/config --enable TRACEPOINTS
        # 禁用CONFIG_DEBUG_INFO_BTF以解决pahole不可用的错误
        ./scripts/config --disable CONFIG_DEBUG_INFO_BTF 
        
        make olddefconfig # 根据已有的.config文件和新的配置选项更新配置，填补缺失的选项，确保配置是最新的
        
        echo "✅ Kernel configuration complete!" # 打印配置完成信息
        grep -E "OVERLAY|KPROBES|KALLSYMS" .config # 验证部分关键配置是否已启用，进行简单检查

    - name: Build kernel with GCC (recommended) # 步骤9：使用GCC构建内核
      run: |
        cd common # 确保当前目录在内核源码根目录
        
        # 设置交叉编译所需的环境变量，指定目标架构为arm64，并设置交叉编译工具链的前缀
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 显式设置各种工具链的可执行文件路径，以确保使用正确的GCC工具链，避免环境路径问题
        export CC=aarch64-linux-gnu-gcc
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        
        # 【核心修复】设置KBUILD_CFLAGS环境变量，强制编译器使用GNU11 C标准
        # 这一行是解决“‘for’ loop initial declarations are only allowed in C99 or C11 mode”错误的关键。
        # 它确保编译器以支持现代C语言语法的方式编译KernelSU的代码。
        export KBUILD_CFLAGS="-std=gnu11" 
        
        # 执行内核构建命令，生成Image.gz-dtb文件
        # -j$(nproc) 参数表示使用所有可用的CPU核心进行并行编译，加快构建速度
        make -j$(nproc) Image.gz-dtb EXTRA_CFLAGS="-std=gnu11" #
        
        # 验证构建结果：检查Image.gz-dtb内核映像文件是否存在
        if [ ! -f "arch/arm64/boot/Image.gz-dtb" ]; then
            echo "::error::Kernel image not found!" # 如果文件不存在，输出错误信息并退出工作流
            exit 1
        fi
        echo "✅ Kernel build successful with GCC!" # 打印构建成功信息

    - name: Prepare artifacts # 步骤10：准备构建产物
      run: |
        mkdir -p out/dist # 创建输出目录，用于存放最终的构建产物
        
        # 复制构建好的内核映像、System.map（用于调试的符号表）和.config文件（内核配置）到输出目录
        cp common/arch/arm64/boot/Image.gz-dtb out/dist/
        cp common/System.map out/dist/
        cp common/.config out/dist/config
        
        cd out/dist # 进入输出目录
        zip -r kernel_artifacts.zip * # 将所有产物打包成一个zip文件，方便下载和管理

    - name: Upload artifacts # 步骤11：上传构建产物
      uses: actions/upload-artifact@v4 # 使用actions/upload-artifact@v4动作上传产物到GitHub Actions的Artifacts存储
      with:
        name: kernel-build # 产物名称，方便在GitHub Actions界面识别
        path: out/dist/kernel_artifacts.zip # 产物在runner上的路径
